name: 🚀 Deploy cloud-mail-docs to Cloudflare Workers

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  Deploy-cloud-mail-docs:
    name: 🏗️ Build and Deploy
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: 🚚 检出代码仓库 / Checkout repository
        uses: actions/checkout@v6

      - name: ⚙ 设置 pnpm / Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: ⚙ 设置 Node.js / Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "./pnpm-lock.yaml"

      - name: 📦 安装依赖 / Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 📡 禁用 Wrangler 遥测 / Disable wrangler telemetry
        run: pnpm wrangler telemetry disable

      - name: 🚀 开始部署 / Start deployment
        id: deploy
        run: |
          pnpm run docs:build && pnpm wrangler deploy | grep -v "https://.*\.workers\.dev" || true
          
          DEPLOY_EXIT_CODE=${PIPESTATUS[0]}
          if [ $DEPLOY_EXIT_CODE -ne 0 ]; then
            exit 1
          fi

      - name: 🗑️ 删除运行记录 / Delete workflow runs
        uses: actions/github-script@v9
        continue-on-error: true
        with:
          script: |
            const retainDays = 1
            const cutoff = Date.now() - retainDays * 24 * 60 * 60 * 1000
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            )

            for (const run of runs) {
              if (run.id === context.runId || new Date(run.created_at).getTime() >= cutoff) {
                continue
              }

              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                })
              } catch (error) {
                core.warning(`Failed to delete workflow run ${run.id}: ${error.message}`)
              }
            }
